<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Job Radar</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mute:#667085;--line:#e4e7ec;--acc:#2f5bea;--good:#12805c;--warn:#b54708;--chip:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#e8eaed;--mute:#98a2b3;--line:#2a303a;--acc:#7a98ff;--good:#4ec9a0;--warn:#f0a35e;--chip:#222833}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
h1{font-size:18px;margin:0}h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:18px 0 8px}
.sub{color:var(--mute);font-size:12px}
.tiles{display:flex;gap:10px;padding:0 20px 12px;flex-wrap:wrap}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.tile b{display:block;font-size:22px}.tile span{color:var(--mute);font-size:12px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:0 20px 40px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
aside{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 16px 16px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
@media(max-width:900px){aside{position:static;max-height:none}}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 3px}
input[type=text],input[type=number],textarea,select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:76px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px}
.w{display:grid;grid-template-columns:78px 1fr 28px;gap:6px;align-items:center;font-size:12px}
.w output{text-align:right;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.list{display:flex;flex-direction:column;gap:8px}
.job{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:start}
.job.applied{opacity:.7}
.score{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px}
.title a{font-weight:600;color:var(--ink);text-decoration:none;font-size:15px}.title a:hover{color:var(--acc);text-decoration:underline}
.meta{color:var(--mute);font-size:12.5px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:var(--chip);border-radius:20px;padding:1px 8px;font-size:11.5px}
.chip.hit{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.src{color:var(--mute)}
.sal{font-weight:600}.sal.none{color:var(--mute);font-weight:400}
.acts{display:flex;flex-direction:column;gap:4px}
.acts button{font-size:12px;padding:3px 8px}
details{margin-top:6px;font-size:12px;color:var(--mute)}
.links a{display:inline-block;margin:0 6px 6px 0;padding:3px 9px;border:1px solid var(--line);border-radius:20px;color:var(--acc);text-decoration:none;font-size:12px}
.empty{padding:40px;text-align:center;color:var(--mute)}
.src-ok{color:var(--good)}.src-bad{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>Marketing Job Radar</h1>
  <div class="sub" id="gen"></div>
</header>
<div class="tiles" id="tiles"></div>
<div class="layout">
<aside>
  <h2>Ranking criteria</h2>
  <label>Keywords (one per line: <code>word: weight 1-5</code>)</label>
  <textarea id="kw"></textarea>
  <label>Exclude (hide if title/tags contain, one per line)</label>
  <textarea id="ex" style="min-height:56px"></textarea>
  <label>Minimum salary, PLN / month (gross, as published)</label>
  <input type="number" id="minSal" step="500">
  <label>Score for offers with no salary shown (0-1)</label>
  <input type="number" id="unk" step="0.1" min="0" max="1">
  <label>Preferred cities (comma separated)</label>
  <input type="text" id="cities">
  <div class="row" style="margin-top:8px"><input type="checkbox" id="remote"><span>Remote counts as a match</span></div>
  <label>Preferred seniority</label>
  <div class="row" id="sen" style="flex-wrap:wrap"></div>
  <h2>Weights</h2>
  <div id="weights"></div>
  <h2>Filters</h2>
  <label>Search</label><input type="text" id="q" placeholder="title, company, tag…">
  <label>Show</label>
  <select id="view"><option value="active">Active (not hidden/applied)</option><option value="saved">Saved</option><option value="applied">Applied</option><option value="hidden">Hidden</option><option value="all">Everything</option></select>
  <label>Location</label>
  <select id="loc"><option value="all">Anywhere</option><option value="pl">Poland only</option><option value="remote">Remote only</option></select>
  <div class="row" style="margin-top:12px"><button id="reset">Reset criteria</button></div>
  <h2>Boards without an API</h2>
  <div class="sub" style="margin-bottom:6px">One-click searches using your top keywords:</div>
  <div class="links" id="links"></div>
  <h2>Sources</h2>
  <div class="sub" id="srcs"></div>
</aside>
<main>
  <div class="sub" id="count" style="margin-bottom:8px"></div>
  <div class="list" id="list"></div>
</main>
</div>
<script>
const DATA = /*__DATA__*/null;
const LS = 'jobradar.v1', ST = 'jobradar.status.v1';
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SENIORITIES = ['Trainee','Junior','Mid','Senior','Expert','Head'];
let C = Object.assign({}, DATA.config, load(LS, {}));
let status = load(ST, {}); // id -> saved|applied|hidden
const kwText = o => Object.entries(o).map(([k, v]) => `${k}: ${v}`).join('\n');
const parseKw = t => Object.fromEntries(t.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
  const [k, v] = l.split(':'); return [k.trim().toLowerCase(), Math.min(5, Math.max(1, parseFloat(v) || 1))]; }));
const lines = t => t.split('\n').map(s => s.trim().toLowerCase()).filter(Boolean);

function score(j) {
  const W = C.weights, tot = Object.values(W).reduce((a, b) => a + b, 0) || 1, why = [];
  const hay = (j.title + ' ' + j.tags.join(' ') + ' ' + j.company).toLowerCase();
  // keywords: matched weight / total weight, but saturate so a few strong hits is already ~full
  const kws = Object.entries(C.keywords), kwTotal = kws.reduce((a, [, w]) => a + w, 0) || 1;
  const hits = kws.filter(([k]) => hay.includes(k));
  const kwS = Math.min(1, hits.reduce((a, [, w]) => a + w, 0) / (kwTotal * 0.4));
  // salary
  const sMax = j.salary_max || j.salary_min, hasSal = !!sMax;
  const salS = hasSal ? Math.min(1, sMax / (C.minSalary || 1) / 1.5) * (sMax >= C.minSalary ? 1 : 0.6) : C.unknownSalary;
  // location
  const city = (j.city || '').toLowerCase();
  const cityHit = C.cities.some(c => city && city.includes(c.toLowerCase()));
  const locS = (C.remoteBonus && j.remote) ? 1 : cityHit ? 1 : (j.country === 'PL' ? 0.4 : 0.1);
  // seniority
  const senS = !C.seniority.length || !j.seniority ? 0.5 : (C.seniority.some(s => j.seniority.includes(s)) ? 1 : 0.15);
  // freshness: 1 today -> 0 at 30 days
  const age = (Date.now() - new Date(j.posted).getTime()) / 864e5;
  const frS = isNaN(age) ? 0.3 : Math.max(0, 1 - age / 30);
  const parts = {keywords: kwS, salary: salS, location: locS, seniority: senS, freshness: frS};
  const total = Object.entries(parts).reduce((a, [k, v]) => a + v * W[k], 0) / tot * 100;
  return {total: Math.round(total), parts, hits: hits.map(h => h[0]), age};
}

function fmtSal(j) {
  if (!j.salary_min && !j.salary_max) return j.salary_note ? `<span class="sal none">${esc(j.salary_note)}</span>` : '<span class="sal none">salary not shown</span>';
  const f = n => Math.round(n / 100) / 10 + 'k';
  return `<span class="sal">${f(j.salary_min || j.salary_max)}${j.salary_max && j.salary_max !== j.salary_min ? '–' + f(j.salary_max) : ''} PLN/mo</span>`;
}
const colour = s => `hsl(${Math.round(s * 1.2)} 62% 40%)`;

function render() {
  const q = $('q').value.toLowerCase(), view = $('view').value, loc = $('loc').value, ex = C.exclude;
  let rows = DATA.jobs.map(j => ({j, s: score(j), st: status[j.id] || ''}));
  rows = rows.filter(({j, st}) => {
    const hay = (j.title + ' ' + j.company + ' ' + j.tags.join(' ') + ' ' + j.city).toLowerCase();
    if (q && !hay.includes(q)) return false;
    if (loc === 'pl' && j.country !== 'PL' && !/pol|warsz|krak|wroc|gda|pozna|łódź|lodz/i.test(j.city)) return false;
    if (loc === 'remote' && !j.remote) return false;
    const excluded = ex.some(e => (j.title + ' ' + j.tags.join(' ')).toLowerCase().includes(e));
    if (view === 'active') return !excluded && !['hidden', 'applied'].includes(st);
    if (view === 'all') return true;
    return st === view;
  }).sort((a, b) => b.s.total - a.s.total);

  const all = DATA.jobs.length, withSal = DATA.jobs.filter(j => j.salary_min || j.salary_max).length;
  const fresh = DATA.jobs.filter(j => (Date.now() - new Date(j.posted)) < 2 * 864e5).length;
  $('tiles').innerHTML = [[all, 'offers'], [rows.length, 'shown'], [rows.filter(r => r.s.total >= 70).length, 'strong matches (70+)'],
    [fresh, 'posted in last 48h'], [Math.round(withSal / all * 100) + '%', 'show salary'], [Object.values(status).filter(s => s === 'applied').length, 'applied']]
    .map(([n, l]) => `<div class="tile"><b>${n}</b><span>${l}</span></div>`).join('');
  $('count').textContent = `${rows.length} offers, ranked by score`;
  $('list').innerHTML = rows.length ? rows.slice(0, 300).map(({j, s, st}, i) => `
    <div class="job ${st}">
      <div class="score" style="background:${colour(s.total)}" title="Match score">${s.total}</div>
      <div>
        <div class="title"><span class="sub">#${i + 1}</span> <a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="meta">${esc(j.company)} · ${esc(j.city || (j.remote ? 'Remote' : '—'))}${j.remote && j.city ? ' (remote ok)' : ''}${j.hybrid ? ' · hybrid' : ''}${j.seniority ? ' · ' + esc(j.seniority) : ''} · ${fmtSal(j)} · ${s.age < 1 ? 'today' : isNaN(s.age) ? '' : Math.floor(s.age) + 'd ago'}</div>
        <div class="chips">${s.hits.map(h => `<span class="chip hit">${esc(h)}</span>`).join('')}${j.tags.filter(t => !s.hits.includes(t.toLowerCase())).slice(0, 5).map(t => `<span class="chip">${esc(t)}</span>`).join('')}<span class="chip src">${esc(j.source)}</span></div>
        <details><summary>Why this score</summary>${Object.entries(s.parts).map(([k, v]) => `${k}: ${Math.round(v * 100)}%`).join(' · ')}</details>
      </div>
      <div class="acts">
        <button data-id="${esc(j.id)}" data-st="saved" class="${st === 'saved' ? 'on' : ''}">★ Save</button>
        <button data-id="${esc(j.id)}" data-st="applied" class="${st === 'applied' ? 'on' : ''}">✓ Applied</button>
        <button data-id="${esc(j.id)}" data-st="hidden" class="${st === 'hidden' ? 'on' : ''}">✕ Hide</button>
      </div>
    </div>`).join('') : '<div class="empty">Nothing matches. Loosen the filters or criteria.</div>';
  const top = Object.keys(C.keywords).slice(0, 2).join(' ') || 'marketing';
  $('links').innerHTML = DATA.search_links.map(l => `<a target="_blank" rel="noopener" href="${esc(l.url.replace('{q}', encodeURIComponent('marketing ' + top)))}">${esc(l.name)} ↗</a>`).join('');
}

function readCriteria() {
  C = {...C, keywords: parseKw($('kw').value), exclude: lines($('ex').value), minSalary: +$('minSal').value || 0,
    unknownSalary: Math.min(1, Math.max(0, +$('unk').value)), cities: $('cities').value.split(',').map(s => s.trim()).filter(Boolean),
    remoteBonus: $('remote').checked, seniority: [...document.querySelectorAll('#sen .on')].map(b => b.dataset.s)};
  save(LS, C); render();
}
function fillControls() {
  $('kw').value = kwText(C.keywords); $('ex').value = C.exclude.join('\n'); $('minSal').value = C.minSalary;
  $('unk').value = C.unknownSalary; $('cities').value = C.cities.join(', '); $('remote').checked = C.remoteBonus;
  $('sen').innerHTML = SENIORITIES.map(s => `<button data-s="${s}" class="${C.seniority.includes(s) ? 'on' : ''}">${s}</button>`).join('');
  $('weights').innerHTML = Object.entries(C.weights).map(([k, v]) => `<div class="w"><span>${k}</span><input type="range" min="0" max="50" value="${v}" data-w="${k}"><output>${v}</output></div>`).join('');
}
$('sen').onclick = e => { if (e.target.dataset.s) { e.target.classList.toggle('on'); readCriteria(); } };
$('weights').oninput = e => { const k = e.target.dataset.w; if (!k) return; C.weights = {...C.weights, [k]: +e.target.value}; e.target.nextElementSibling.textContent = e.target.value; save(LS, C); render(); };
['kw', 'ex', 'minSal', 'unk', 'cities', 'remote'].forEach(id => $(id).addEventListener('input', readCriteria));
['q', 'view', 'loc'].forEach(id => $(id).addEventListener('input', render));
$('list').onclick = e => { const b = e.target.closest('button[data-id]'); if (!b) return;
  const id = b.dataset.id; status[id] = status[id] === b.dataset.st ? '' : b.dataset.st; save(ST, status); render(); };
$('reset').onclick = () => { C = {...DATA.config}; save(LS, {}); fillControls(); render(); };
$('gen').textContent = 'Updated ' + new Date(DATA.generated).toLocaleString();
$('srcs').innerHTML = Object.entries(DATA.sources).map(([k, v]) => `<div class="${v.startsWith('ok') ? 'src-ok' : 'src-bad'}">${k}: ${esc(v)}</div>`).join('');
fillControls(); render();
</script>
</body>
</html>
